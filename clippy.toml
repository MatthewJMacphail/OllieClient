too-many-lines-threshold = 60
excessive-nesting-threshold = 4
cognitive-complexity-threshold = 15

disallowed-types = [
    { path = "std::vec::Vec", reason = "no dynamic allocation after init" },
    { path = "std::boxed::Box", reason = "no dynamic allocation after init" },
    { path = "std::string::String", reason = "no dynamic allocation after init" },
]